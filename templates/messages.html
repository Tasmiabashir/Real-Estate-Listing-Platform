<!DOCTYPE html>
<html>
<head>
    <title>Messages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">
    <h2>Messages</h2>

    {% if messages %}
        {% for m in messages %}
            <div class="card">
                <h4>Property: {{ m.title }}</h4>
                <p>{{ m.message }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>No messages yet.</p>
    {% endif %}
</div>

</body>
</html>

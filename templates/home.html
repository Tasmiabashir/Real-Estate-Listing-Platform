<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="nav">
    <a href="/">Home</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
</div>

<div class="container">
<form method="GET" class="search-bar">
    <input type="text" name="city" placeholder="City"
           value="{{ city or '' }}">

    <input type="number" name="min_price" placeholder="Min Price"
           value="{{ min_price or '' }}">

    <input type="number" name="max_price" placeholder="Max Price"
           value="{{ max_price or '' }}">

    <button type="submit">🔍 Search</button>
</form>

    <h1>Available Properties</h1>
 <div class="property-grid">
    {% if properties %}
   
        {% for p in properties %}
        
            <div class="card">

                {% if p.image %}
                    <img src="{{ url_for('static', filename='uploads/' ~ p.image) }}"
                         style="width:100%; height:200px; object-fit:cover; border-radius:6px;">
                {% else %}
                    <img src="{{ url_for('static', filename='no-image.png') }}"
                         style="width:100%; height:200px; object-fit:cover; border-radius:6px;">
                {% endif %}

                <h3>{{ p.title }}</h3>
                <p><strong>City:</strong> {{ p.city }}</p>
                <p><strong>Price:</strong> {{ p.price }}</p>
                <p><strong>Purpose:</strong> {{ p.purpose }}</p>

                <a href="/property/{{ p.id }}">View Details</a>
            </div>
             
        {% endfor %}
    {% else %}
        <p>No properties available.</p>
    {% endif %}
</div>
 </div>

</body>
</html>
